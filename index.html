<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I Love You - Coração</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #000000;
  }
  #playBtn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #ffbc61;
    color: #000;
    border: none;
    border-radius: 30px;
    padding: 18px 34px;
    font: bold 17px Arial;
    cursor: pointer;
    z-index: 10;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.07); }
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<audio id="musica" src="musica.mp3" loop preload="auto" playsinline></audio>
<button id="playBtn">❤ Toque para abrir sua surpresa</button>
<script>
  const canvas = document.getElementById('heart');
  const ctx = canvas.getContext('2d');

  // Nitidez no celular: acompanha devicePixelRatio (telas HD/Retina)
  let W = 0, H = 0;
  function setupCtx() {
    ctx.fillStyle = '#ffbc61';
    ctx.font = 'bold 9px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    setupCtx();
  }
  window.addEventListener('resize', resize);
  resize();

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const DELAY = 50; // <-- velocidade: aumente p/ mais lento (ex: 80), diminua p/ mais rápido (ex: 10)

  function heartPoint(angle) {
    const s = Math.sin(angle);
    const x = 16 * s * s * s;
    const y = 13 * Math.cos(angle)
            - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle)
            - Math.cos(4 * angle);
    return { x, y };
  }

  async function drawHeart() {
    while (true) {
      ctx.clearRect(0, 0, W, H);
      setupCtx();

      // Escala (scale) de 11 até 16, igual ao laço do turtle
      for (let scale = 11; scale <= 16; scale++) {
        // Fator responsivo: cabe em qualquer tela (celular incluso)
        // Coração tem ~32 de largura e ~30 de altura na matemática pura.
        // baseFit faz caber na menor dimensão; (scale/16) faz a animação crescer.
        const baseFit = Math.min(W, H) / 34;
        const k = baseFit * (scale / 16);

        const cx = W / 2;
        // Corrige centro vertical (coração vai de y=-17 até y~12, meio em -2.5)
        const cy = H / 2 - 2.5 * k;

        for (let i = 0; i < 120; i++) {
          const angle = i * (2 * Math.PI) / 120;
          const p = heartPoint(angle);
          const sx = cx + p.x * k;
          const sy = cy - p.y * k; // inverte Y (canvas cresce p/ baixo)
          ctx.fillText('I love you', sx, sy);
          await sleep(DELAY); // delay curto = efeito turtle
        }
      }
      await sleep(2500); // pausa no final e recomeça o laço
    }
  }

  // Modo surpresa: animação + música começam juntas no 1º toque
  const musica = document.getElementById('musica');
  const playBtn = document.getElementById('playBtn');
  musica.volume = 1;
  musica.muted = false;
  let started = false;
  function startMusic() {
    try {
      const p = musica.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (e) { /* ignora: o coração desenha mesmo sem áudio */ }
  }
  function abrir() {
    if (started) { startMusic(); return; }
    started = true;
    playBtn.style.display = 'none';
    drawHeart(); // coração primeiro: nunca trava por causa do áudio
    startMusic();
  }
  playBtn.addEventListener('click', abrir);
  // Qualquer toque na tela também abre (vale p/ celular)
  ['pointerdown', 'touchend', 'keydown'].forEach(ev =>
    document.addEventListener(ev, abrir, { once: true })
  );
</script>
</body>
</html>
